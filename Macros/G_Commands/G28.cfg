[gcode_macro G28F]
# rename_existing: G28_BASE klicky already uses homing_override
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% set params = rawparams | string | default("Y Y Z") %}

    _status_homing

    # {% if ("X" in params) or (params == "") and "x" in homed %}
    #     # SET_CONFIG_VALUE SECTION=stepper_x KEY=homing_speed VALUE=80
    #     G90
    #     G0 X{printer.toolhead.axis_maximum.x-10} F9000
    #     G28_BASE X
    # {% endif %}
    # {% if ("Y" in params) or (params == "") and "y" in homed %}
    #     # SET_CONFIG_VALUE SECTION=stepper_y KEY=homing_speed VALUE=80
    #     G90
    #     G0 Y{printer.toolhead.axis_maximum.y-10} F9000
    #     G28_BASE Y
    # {% endif %}
    # {% if ("Z" in params) or (params == "") and "z" in homed %}
    #     # SET_CONFIG_VALUE SECTION=stepper_z KEY=homing_speed VALUE=20
    #     G90
    #     G0 Z{printer.toolhead.axis_maximum.z-10} F9000
    #     G28_BASE Z
    # {% endif %}

    {% set axis_pos = { "X": "X" ~ (printer.toolhead.axis_maximum.x - 10),
                        "Y": "Y" ~ (printer.toolhead.axis_maximum.y - 10),
                        "Z": "Z" ~ (printer.toolhead.axis_maximum.z - 10) } %}

    {% for axis in ["X", "Y", "Z"] %}
        _DEBUG MSG={axis}
        _DEBUG MSG={params}
        _DEBUG MSG={homed}
        {% if (params == "") or (axis in params) or (axis | lower) in homed %}
            G90
            G0 {axis_pos[axis]} F9000
            G28 {axis}
        {% else %}
            G28 {axis}
        {% endif %}
    {% endfor %}

    # G28_BASE {rawparams}
    _status_ready
