[gcode_macro G28]
rename_existing: G28_BASE
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% set params = rawparams | string %}

    _status_homing

    {% if ("X" in params) or (params == "") %}
        {% if "x" in homed %}
            # SET_CONFIG_VALUE SECTION=stepper_x KEY=homing_speed VALUE=80
            G90
            G0 X{printer.toolhead.axis_maximum.x-10} F9000
            G28_BASE X
        {% endif %}
    {% endif %}
    {% if ("Y" in params) or (params == "") %}
        {% if "y" in homed %}
            # SET_CONFIG_VALUE SECTION=stepper_y KEY=homing_speed VALUE=80
            G90
            G0 Y{printer.toolhead.axis_maximum.y-10} F9000
            G28_BASE Y
        {% endif %}
    {% endif %}
    {% if ("Z" in params) or (params == "") %}
        {% if "z" in homed %}
            # SET_CONFIG_VALUE SECTION=stepper_z KEY=homing_speed VALUE=20
            G90
            G0 Z{printer.toolhead.axis_maximum.z-10} F9000
            G28_BASE Z
        {% endif %}
    {% endif %}

    # G28_BASE {rawparams}
    _status_ready
